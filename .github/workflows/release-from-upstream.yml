name: Release from upstream

run-name: Release ${{ inputs.version }} from ${{ inputs.upstream_repo == 'ofiwg/libfabric' && 'ofiwg' || inputs.upstream_repo }}@${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo to pull source from'
        required: false
        type: string
        default: 'ofiwg/libfabric'
      ref:
        description: 'Git ref to release from (branch, tag, or SHA)'
        required: true
        type: string
      version:
        description: 'Release version (e.g. 2.5.0amzn1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  invocation:
    runs-on: ubuntu-latest
    steps:
    - name: Render invocation summary
      env:
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        INPUT_REF: ${{ inputs.ref }}
        VERSION: ${{ inputs.version }}
        SERVER_URL: ${{ github.server_url }}
      run: |
        {
          echo "| Input | Value |"
          echo "|---|---|"
          echo "| Upstream repo | [\`${UPSTREAM_REPO}\`](${SERVER_URL}/${UPSTREAM_REPO}) |"
          echo "| Upstream ref | [\`${INPUT_REF}\`](${SERVER_URL}/${UPSTREAM_REPO}/tree/${INPUT_REF}) |"
          echo "| Version | \`${VERSION}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

  prepare-source:
    runs-on: ubuntu-latest
    concurrency:
      group: aws-release-prepare
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      upstream_sha: ${{ steps.upstream.outputs.upstream_sha }}
      upstream_sha_short: ${{ steps.upstream.outputs.upstream_sha_short }}
      release_commit_sha: ${{ steps.release_commit.outputs.sha }}
      build_ref: ${{ steps.build_ref.outputs.ref }}
      build_branch: ${{ steps.build_ref.outputs.branch }}
    steps:
    - name: Checkout release tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Validate upstream repo
      if: ${{ inputs.upstream_repo != 'ofiwg/libfabric' }}
      env:
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
      run: |
        echo "::warning title=Non-default upstream repo::Using '${UPSTREAM_REPO}' instead of 'ofiwg/libfabric'"

    - name: Validate version
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+amzn[0-9]+\.[0-9]+$'; then
          echo "::error title=Invalid version::Version '${VERSION}' does not match the required AWS-specific format 'X.Y.ZamznN.N' (for example, '2.4.0amzn1.0'). Bare upstream versions are not permitted."
          exit 1
        fi

    - name: Checkout upstream source
      id: upstream
      env:
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        INPUT_REF: ${{ inputs.ref }}
      run: |
        echo "::debug::Cloning ${UPSTREAM_REPO} and checking out ${INPUT_REF}"
        git clone --no-checkout "https://github.com/${UPSTREAM_REPO}.git" source
        cd source
        git checkout "${INPUT_REF}"
        echo "::debug::Checked out $(git rev-parse HEAD)"
        echo "upstream_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "upstream_sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Reject published upstream release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
      run: |
        OFFICIAL_UPSTREAM_REPO="ofiwg/libfabric"

        if ! RELEASE_TAGS=$(gh api "repos/${OFFICIAL_UPSTREAM_REPO}/releases" --paginate \
          --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'); then
          echo "::error title=Unable to verify upstream release policy::Could not enumerate published releases from ${OFFICIAL_UPSTREAM_REPO}."
          exit 1
        fi
        if ! OFFICIAL_TAG_REFS=$(git ls-remote --tags "https://github.com/${OFFICIAL_UPSTREAM_REPO}.git"); then
          echo "::error title=Unable to verify upstream release policy::Could not enumerate tags from ${OFFICIAL_UPSTREAM_REPO}."
          exit 1
        fi

        while IFS= read -r RELEASE_TAG; do
          [ -n "${RELEASE_TAG}" ] || continue
          RELEASE_SHA=$(printf '%s\n' "${OFFICIAL_TAG_REFS}" | awk \
            -v tag="refs/tags/${RELEASE_TAG}" \
            '$2 == tag { direct = $1 } $2 == tag "^{}" { peeled = $1 } END { print peeled ? peeled : direct }')
          if [ -z "${RELEASE_SHA}" ]; then
            echo "::error title=Unable to verify upstream release policy::Published release tag '${RELEASE_TAG}' could not be resolved in ${OFFICIAL_UPSTREAM_REPO}."
            exit 1
          fi
          if [ "${RELEASE_SHA}" = "${UPSTREAM_SHA}" ]; then
            RELEASE_URL="${GITHUB_SERVER_URL}/${OFFICIAL_UPSTREAM_REPO}/releases/tag/${RELEASE_TAG}"
            echo "::error title=Official upstream release cannot be rebuilt::The selected ref resolves exactly to published upstream release ${RELEASE_TAG} (${RELEASE_URL}). AWS does not mirror or rebuild official upstream releases. Consume the OFIWG release directly, or select an unreleased upstream ref, such as the current tip of a backport branch."
            exit 1
          fi
        done <<< "${RELEASE_TAGS}"

    - name: Check release version suggestion
      id: version
      env:
        VERSION: ${{ inputs.version }}
        INPUT_REF: ${{ inputs.ref }}
        AWS_LIBFABRIC_REPO: https://github.com/${{ github.repository }}.git
        UPSTREAM_LIBFABRIC_REPO: https://github.com/${{ inputs.upstream_repo }}.git
      run: |
        RELEASE_VERSION="${VERSION}"
        TAG="v${RELEASE_VERSION}"

        # Compare against what the derivation script would suggest and warn if different
        cd source
        SUGGESTED=""
        if DERIVATION_LOG=$(bash "$GITHUB_WORKSPACE/.github/scripts/derive-release-version.sh" "${INPUT_REF}" 2>&1); then
          SUGGESTED=$(echo "${DERIVATION_LOG}" | tail -1 | awk '{print $NF}')
        else
          ANNOTATION_LOG=$(echo "${DERIVATION_LOG}" | sed 's/$/%0A/' | tr -d '\n')
          echo "::notice title=Unable to derive version suggestion::Continuing with the operator-specified version '${VERSION}'.%0A${ANNOTATION_LOG}"
        fi
        cd ..
        if [ -n "${SUGGESTED}" ] && [ "${SUGGESTED}" != "${RELEASE_VERSION}" ]; then
          ANNOTATION_LOG=$(echo "${DERIVATION_LOG}" | sed 's/$/%0A/' | tr -d '\n')
          echo "::warning title=Specified version differs from derived suggestion::Specified version: ${RELEASE_VERSION}%0ADerived suggestion: ${SUGGESTED}%0A%0A${ANNOTATION_LOG}"
        fi

        echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Check tag does not exist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
        if git ls-remote --tags "${REMOTE}" "${TAG}" | grep -q .; then
          echo "::error title=Tag already exists::Tag ${TAG} already exists in ${REPO}"
          exit 1
        fi

    - name: Patch version
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd source
        echo "::debug::Patching configure.ac with version ${RELEASE_VERSION}"
        sed -i "s/AC_INIT(\[libfabric\], \[[^]]*\], \[[^]]*\])/AC_INIT([libfabric], [${RELEASE_VERSION}], [ec2-efa-maintainers@amazon.com])/" configure.ac

    - name: Verify version patch
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd source
        PATCHED=$(grep 'AC_INIT' configure.ac)
        if ! echo "${PATCHED}" | grep -q "${RELEASE_VERSION}"; then
          echo "::error title=Version patch failed::configure.ac does not contain expected version ${RELEASE_VERSION}. Found: ${PATCHED}"
          exit 1
        fi

    - name: Create sanitized release commit
      id: release_commit
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd source

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # GitHub's GITHUB_TOKEN cannot push commits that introduce upstream
        # workflow files. Build a root snapshot so workflow changes are absent
        # from both the release tree and its ancestry.
        SNAPSHOT_INDEX="${RUNNER_TEMP}/release-index-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        trap 'rm -f "${SNAPSHOT_INDEX}"' EXIT
        GIT_INDEX_FILE="${SNAPSHOT_INDEX}" git read-tree HEAD
        GIT_INDEX_FILE="${SNAPSHOT_INDEX}" git rm -r --cached --ignore-unmatch .github/workflows

        GIT_INDEX_FILE="${SNAPSHOT_INDEX}" git add configure.ac

        SNAPSHOT_TREE=$(GIT_INDEX_FILE="${SNAPSHOT_INDEX}" git write-tree)
        RELEASE_COMMIT=$(printf 'v%s\n' "${RELEASE_VERSION}" | git commit-tree "${SNAPSHOT_TREE}")
        git checkout --force --detach "${RELEASE_COMMIT}"

        if git ls-tree -r --name-only HEAD -- .github/workflows | grep -q .; then
          echo "::error title=Release sanitization failed::Release commit contains files under .github/workflows"
          exit 1
        fi
        if git rev-parse HEAD^ >/dev/null 2>&1; then
          echo "::error title=Release sanitization failed::Release commit unexpectedly has a parent"
          exit 1
        fi

        echo "sha=${RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"

    - name: Check version reservation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
      run: |
        REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
        EXISTING=$(git ls-remote --heads "${REMOTE}" "ci/aws-release-build/${RELEASE_VERSION}-*")
        if [ -n "${EXISTING}" ]; then
          echo "::error title=Version already reserved::Version ${RELEASE_VERSION} is being processed by another workflow run."
          echo "Existing reservation(s):"
          echo "${EXISTING}"
          exit 1
        fi
        echo "No existing reservation for ${RELEASE_VERSION}. Proceeding."

    - name: Push temporary build branch
      id: build_ref
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RELEASE_VERSION: ${{ steps.version.outputs.version }}
        RUN_ID: ${{ github.run_id }}
      run: |
        BRANCH="ci/aws-release-build/${RELEASE_VERSION}-${RUN_ID}"
        REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
        cd source
        git push --force "${REMOTE}" "HEAD:refs/heads/${BRANCH}"
        echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
        echo "ref=${BRANCH}" >> "$GITHUB_OUTPUT"

  build-artifacts:
    needs: prepare-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - name: Checkout source from temporary build branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.prepare-source.outputs.build_ref }}
        fetch-depth: 0
        persist-credentials: false

    - name: Resolve version
      id: version
      run: |
        RELEASE_VERSION=$(grep 'AC_INIT' configure.ac | sed 's/.*\[libfabric\], \[\([^]]*\)\].*/\1/')
        TAG="v${RELEASE_VERSION}"
        echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool

    - name: Build libfabric dist tarballs
      run: |
        set -euxo pipefail
        ./autogen.sh
        ./configure
        make
        make dist

    - name: Collect release artifacts
      run: |
        mkdir -p release-artifacts
        cp libfabric-*.tar.* release-artifacts/

    - name: Upload release artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-artifacts
        path: release-artifacts/*
        if-no-files-found: error

  preview:
    needs: [prepare-source, build-artifacts]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout release tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-artifacts
        path: release-artifacts

    - name: Validate build metadata
      env:
        PREP_VERSION: ${{ needs.prepare-source.outputs.version }}
        BUILD_VERSION: ${{ needs.build-artifacts.outputs.version }}
        PREP_TAG: ${{ needs.prepare-source.outputs.tag }}
        BUILD_TAG: ${{ needs.build-artifacts.outputs.tag }}
      run: |
        if [ "${PREP_VERSION}" != "${BUILD_VERSION}" ]; then
          echo "::error title=Version mismatch::prepare-source=${PREP_VERSION} build-artifacts=${BUILD_VERSION}"
          exit 1
        fi
        if [ "${PREP_TAG}" != "${BUILD_TAG}" ]; then
          echo "::error title=Tag mismatch::prepare-source=${PREP_TAG} build-artifacts=${BUILD_TAG}"
          exit 1
        fi

    - name: Render preview
      env:
        RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        UPSTREAM_SHA: ${{ needs.prepare-source.outputs.upstream_sha }}
        RELEASE_REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        CURRENT_TAG: ${{ needs.build-artifacts.outputs.tag }}
        RELEASE_COMMIT_SHA: ${{ needs.prepare-source.outputs.release_commit_sha }}
        BUILD_ATTESTATION_URL: "[link generated at publish time]"
        SOURCE_BINDING_ATTESTATION_URL: "[link generated at publish time]"
      run: |
        BODY=$(bash "$GITHUB_WORKSPACE/.github/scripts/render-release-body.sh")
        {
          echo "## Release Preview"
          echo "- Version: ${RELEASE_VERSION}"
          echo "- Tag: \`${CURRENT_TAG}\`"
          echo "- Upstream ref: ${UPSTREAM_REPO}@${UPSTREAM_SHA}"
          echo "- Release commit: ${RELEASE_REPO}@${RELEASE_COMMIT_SHA}"
          echo ""
          echo "### Artifacts"
          echo ""
          echo '```'
          ls -la release-artifacts/
          echo '```'
          echo ""
          echo "<details><summary>Release notes preview</summary>"
          echo ""
          echo "${BODY}"
          echo ""
          echo "</details>"
          echo ""
          echo "Review the above, then approve or reject the \`publish-release\` job to proceed."
        } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    needs: [prepare-source, build-artifacts, preview]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ steps.create-release.outputs.url }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout release tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-artifacts
        path: release-artifacts

    - name: Re-check tag does not exist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        TAG: ${{ needs.build-artifacts.outputs.tag }}
      run: |
        REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
        if git ls-remote --tags "${REMOTE}" "${TAG}" | grep -q .; then
          echo "::error title=Tag already exists::Tag ${TAG} already exists in ${REPO}"
          exit 1
        fi

    - name: Push tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        BUILD_BRANCH: ${{ needs.prepare-source.outputs.build_branch }}
        RELEASE_SHA: ${{ needs.prepare-source.outputs.release_commit_sha }}
        TAG: ${{ needs.build-artifacts.outputs.tag }}
        RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
      run: |
        set -euo pipefail
        REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

        git init source
        cd source
        git remote add origin "${REPO_URL}"
        git fetch --no-tags origin "refs/heads/${BUILD_BRANCH}:refs/remotes/origin/${BUILD_BRANCH}"
        git checkout --detach "${RELEASE_SHA}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git tag -a "${TAG}" -m "AWS libfabric release ${RELEASE_VERSION}"

        echo "::debug::Pushing tag ${TAG} to ${REPO}"
        git push "${REPO_URL}" "refs/tags/${TAG}"

    - name: Attest release artifacts
      id: attest
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: 'release-artifacts/*.tar.*'

    - name: Generate source binding predicate
      env:
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        INPUT_REF: ${{ inputs.ref }}
        UPSTREAM_SHA: ${{ needs.prepare-source.outputs.upstream_sha }}
        RELEASE_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ needs.build-artifacts.outputs.tag }}
        RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
        RELEASE_COMMIT: ${{ needs.prepare-source.outputs.release_commit_sha }}
        WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        CHECKSUMS=$(sha256sum release-artifacts/*.tar.* | sort -k2)
        ARTIFACTS_JSON=$(printf '%s\n' "${CHECKSUMS}" | jq -R -s '
          split("\n")
          | map(select(length > 0))
          | map(capture("^(?<sha256>[0-9a-f]{64})  (?<path>.+)$"))
          | map({path: .path, sha256: .sha256})
        ')
        jq -n \
          --arg upstream_repo "${UPSTREAM_REPO}" \
          --arg input_ref "${INPUT_REF}" \
          --arg upstream_sha "${UPSTREAM_SHA}" \
          --arg release_repo "${RELEASE_REPO}" \
          --arg release_tag "${RELEASE_TAG}" \
          --arg release_version "${RELEASE_VERSION}" \
          --arg release_commit "${RELEASE_COMMIT}" \
          --arg workflow_run_url "${WORKFLOW_RUN_URL}" \
          --argjson artifacts "${ARTIFACTS_JSON}" \
          '{
            source: {
              upstream_repository: $upstream_repo,
              requested_ref: $input_ref,
              resolved_upstream_sha: $upstream_sha
            },
            release: {
              repository: $release_repo,
              version: $release_version,
              tag: $release_tag,
              commit: $release_commit,
              workflow_run_url: $workflow_run_url
            },
            artifacts: $artifacts
          }' > source-binding-predicate.json

    - name: Attest upstream source binding
      id: source-binding-attest
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: 'release-artifacts/*.tar.*'
        predicate-type: 'urn:aws:libfabric:attestation:upstream-binding:v1'
        predicate-path: source-binding-predicate.json

    - name: Render release body
      id: body
      env:
        RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        UPSTREAM_SHA: ${{ needs.prepare-source.outputs.upstream_sha }}
        RELEASE_REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        CURRENT_TAG: ${{ needs.build-artifacts.outputs.tag }}
        BUILD_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        SOURCE_BINDING_ATTESTATION_URL: ${{ steps.source-binding-attest.outputs.attestation-url }}
      run: |
        BODY=$(bash "$GITHUB_WORKSPACE/.github/scripts/render-release-body.sh")
        {
          echo "body<<RELEASE_BODY_EOF"
          echo "${BODY}"
          echo "RELEASE_BODY_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create release
      id: create-release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.build-artifacts.outputs.tag }}
        name: Libfabric ${{ needs.build-artifacts.outputs.version }}
        draft: false
        body: ${{ steps.body.outputs.body }}
        files: |
          release-artifacts/*

    - name: Release summary
      env:
        RELEASE_VERSION: ${{ needs.build-artifacts.outputs.version }}
        CURRENT_TAG: ${{ needs.build-artifacts.outputs.tag }}
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        UPSTREAM_SHA: ${{ needs.prepare-source.outputs.upstream_sha }}
        RELEASE_REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        RELEASE_COMMIT_SHA: ${{ needs.prepare-source.outputs.release_commit_sha }}
        ATTEST_URL: ${{ steps.attest.outputs.attestation-url }}
        SOURCE_BINDING_URL: ${{ steps.source-binding-attest.outputs.attestation-url }}
        RELEASE_URL: ${{ steps.create-release.outputs.url }}
      run: |
        {
          echo "## Release Summary"
          echo "- **Version**: ${RELEASE_VERSION}"
          echo "- **Tag**: [\`${CURRENT_TAG}\`](${SERVER_URL}/${RELEASE_REPO}/releases/tag/${CURRENT_TAG})"
          echo "- **Upstream ref**: ${UPSTREAM_REPO}@${UPSTREAM_SHA}"
          echo "- **Release commit**: ${RELEASE_REPO}@${RELEASE_COMMIT_SHA}"
          echo "- **Build provenance attestation**: [View](${ATTEST_URL})"
          echo "- **Source binding attestation**: [View](${SOURCE_BINDING_URL})"
          echo "- **Release**: [View](${RELEASE_URL})"
        } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: ${{ always() && needs.prepare-source.outputs.build_branch != '' }}
    needs: [prepare-source, build-artifacts, preview, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Delete temporary build branch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        BUILD_BRANCH: ${{ needs.prepare-source.outputs.build_branch }}
      run: |
        REF="heads/${BUILD_BRANCH}"
        ERR=$(gh api -X DELETE "repos/${REPO}/git/refs/${REF}" 2>&1) && RC=0 || RC=$?
        if [ "${RC}" -eq 0 ]; then
          echo "Deleted temporary build branch ${REF}"
        elif echo "${ERR}" | grep -qiE "reference.*does not exist|not found|422"; then
          echo "Temporary build branch ${REF} was already absent"
        else
          echo "::warning title=Cleanup failed::Could not delete temporary build branch ${REF}: ${ERR}"
        fi
